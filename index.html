  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(reg) {
              console.log('[CloudboyX PWA] ServiceWorker registered with scope:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[CloudboyX PWA] ServiceWorker registration notice:', err);
            });
        });
      }
    </script>
